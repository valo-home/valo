<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
:root{color-scheme:light dark;--ink:#e5ecf0;--dim:#9aabb6;--amber:#ffa64a;--track:#212c34}
@media (prefers-color-scheme:light){:root{--ink:#0f1519;--dim:#4a5964;--amber:#f08a1c;--track:#d6dee3}}
body{margin:0;font:14px/1.4 system-ui,sans-serif;color:var(--ink);background:transparent}
.w{display:grid;gap:8px;padding:4px}.t{font-size:34px;font-weight:300}.d{color:var(--dim);font-size:12px}
.b{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.b i{display:block;height:100%;background:var(--amber);transition:width .6s}
</style></head><body><div class="w"><div class="t" id="t">--</div><div class="b"><i id="bar" style="width:0"></i></div><div class="d" id="d"></div></div>
<script>
const L={uk:['нагрів','готова','вимкнена','хв'],en:['heating','ready','off','min'],ru:['нагрев','готова','выключена','мин'],ja:['加熱中','準備完了','オフ','分'],fr:['chauffe','prêt','éteint','min'],de:['heizt','bereit','aus','min'],es:['calentando','lista','apagada','min']};
addEventListener('message',e=>{const m=e.data||{};if(m.type!=='state')return;const s=m.state||{},l=L[m.lang]||L.en,target=m.settings?.ready||75;
document.getElementById('t').textContent=s.t!=null?Number(s.t).toFixed(1)+' °C':'--';
document.getElementById('bar').style.width=Math.max(0,Math.min(100,(s.t||0)/target*100))+'%';
document.getElementById('d').textContent=(s.phase==='heating'?l[0]:s.phase==='ready'?l[1]:l[2])+(s.eta?' · '+s.eta+' '+l[3]:'')});
parent.postMessage({type:'ready',device:'session'},'*');
</script></body></html>
