name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests ../extensions
      - run: uv run lint-imports
      - run: ./scripts/test.sh -q

  mocks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mocks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check valo_mocks tests
      - run: uv run python -m unittest discover -s tests

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh valo backend/scripts/*.sh
      - run: docker compose config -q
