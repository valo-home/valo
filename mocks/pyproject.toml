[project]
name = "valo-mocks"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["aiomqtt>=2.5.1", "httpx>=0.28.1", "asyncpg>=0.32.0"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E701", "E731", "RUF001", "RUF012", "ASYNC109"]
