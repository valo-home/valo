[project]
name = "valo"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "litestar[cli]>=2.24,<3",
    "litestar-granian>=0.16",
    "msgspec>=0.22",
    "advanced-alchemy>=1.11,<2",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "asyncpg>=0.32",
    "atlas-provider-sqlalchemy>=0.5.2",
    "python-socketio>=5.13",
    "taskiq[reload]>=0.13,<0.14",
    "taskiq-aio-pika>=0.6",
    "redis>=6",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.3",
    "structlog>=25",
    "python-dotenv>=1.1",
    "click>=8.1",
    "wait-for-it>=2.3",
    "aiomqtt>=2.4",
    "cryptography>=44",
    "openai>=3.46.0",
    "httpx>=0.28",
    "onnxruntime>=1.31",
    "numpy>=2.5",
    "pillow>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "anyio>=4", "httpx>=0.28", "ruff>=0.14", "import-linter>=2.3", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E701", "E702", "E731", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "ASYNC109", "ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = ["app.server | app.ws | app.mqtt | app.ext | app.agent | app.cameras", "app.domain", "app.db", "app.lib"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
